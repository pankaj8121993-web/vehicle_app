name: quality

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      JWT_SECRET: ci-only-random-test-secret-not-used-outside-ci
      CORS_ORIGINS: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests -q
      - run: python -m compileall -q backend
      - run: python -m flake8 backend --select=E9,F63,F7,F82

  frontend:
    runs-on: ubuntu-latest
    # The role-matrix E2E starts the real backend and seeds a disposable role
    # fixture, so this job needs MongoDB and a Python that has the backend deps.
    services:
      mongo:
        image: mongo:7.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npm run test:ci -- --runInBand
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # The role matrix runs three projects (desktop Chromium, exact 360x800
      # mobile Chromium, and a representative Firefox subset), so both browser
      # engines must be installed. Firefox tests retry (retries: 2) to absorb
      # recharts' occasional benign ResizeObserver pageerror.
      - run: npx playwright install --with-deps chromium firefox
        working-directory: frontend
      # The E2E webServers and fixture use the CI runner's Python (which has the
      # backend deps installed above), not the dev-container .venv path.
      - run: npm run test:e2e
        working-directory: frontend
        env:
          FLEETFLOW_ROLE_E2E_PYTHON: python
          FLEETFLOW_ROLE_E2E_MONGO_URL: mongodb://127.0.0.1:27017
