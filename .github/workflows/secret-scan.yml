name: secret-scan

# Blocks secrets from entering the repository. Runs on every push and pull
# request. Uses a pinned, checksum-verified gitleaks binary (SEC-003).

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      # Pinned scanner version and the official SHA-256 of the linux_x64 tarball
      # (from gitleaks_8.30.1_checksums.txt). Bump both together on upgrade.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout (full history)
        # actions/checkout v4.2.2 pinned by commit SHA.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Install pinned gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSL -o gitleaks.tar.gz "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan git history and tree for secrets
        run: |
          set -euo pipefail
          # --redact ensures no secret value is ever printed in the logs.
          # Exit code is non-zero when leaks are found, failing the job.
          gitleaks git . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --report-format sarif \
            --report-path gitleaks.sarif

      - name: Upload SARIF report
        if: always()
        # actions/upload-artifact v4.4.3 pinned by commit SHA.
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
